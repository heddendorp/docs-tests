name: Publish npm package

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'knope/release'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:list
      - run: npm run package:check
      - run: npm run package:smoke
      - name: Verify open-source release metadata
        run: |
          node -e 'const { license } = require("./package.json"); if (!license || license === "UNLICENSED") { throw new Error("Choose an SPDX license before publishing."); }'
          test -f LICENSE || test -f LICENSE.md
      - name: Publish when this version is new
        run: |
          package_name="$(node -p \"require('./package.json').name\")"
          package_version="$(node -p \"require('./package.json').version\")"
          if npm view "$package_name@$package_version" version --json >/dev/null 2>&1; then
            echo "$package_name@$package_version is already published."
            exit 0
          fi
          npm publish --access public --provenance
